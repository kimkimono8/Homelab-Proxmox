---
- name: Install complete CLI & SysAdmin toolchain on Arch Linux
  community.general.pacman:
    name:
      - zsh
      - starship
      - fzf
      - lsd
      - bat
      - git
      - curl
      - github-cli
      - bind-tools
      - htop
      - unzip
      - less
      - openssh
      - ansible
    state: present
  become: true
  when: ansible_facts['os_family'] == "Archlinux"

- name: Install official HashiCorp Terraform binary on Arch Linux
  block:
    - name: Download Terraform binary archive
      ansible.builtin.get_url:
        url: "https://releases.hashicorp.com/terraform/1.9.5/terraform_1.9.5_linux_amd64.zip"
        dest: "/tmp/terraform_1.9.5_linux_amd64.zip"
        mode: '0644'

    - name: Extract Terraform binary to /usr/local/bin
      ansible.builtin.unarchive:
        src: "/tmp/terraform_1.9.5_linux_amd64.zip"
        dest: "/usr/local/bin"
        remote_src: yes
        creates: "/usr/local/bin/terraform"
        mode: '0755'

    - name: Clean up temporary zip archive
      ansible.builtin.file:
        path: "/tmp/terraform_1.9.5_linux_amd64.zip"
        state: absent
  become: true
  when: ansible_facts['os_family'] == "Archlinux"

- name: Install baseline CLI packages on Debian/Ubuntu
  ansible.builtin.apt:
    name:
      - zsh
      - git
      - curl
      - fzf
    state: present
    update_cache: yes
    cache_valid_time: 3600
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure .config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config"
    state: directory
    mode: '0755'

- name: Deploy starship configuration
  ansible.builtin.copy:
    src: starship.toml
    dest: "{{ ansible_facts['user_dir'] }}/.config/starship.toml"
    mode: '0644'

- name: Deploy standardized .zshrc
  ansible.builtin.copy:
    src: zshrc
    dest: "{{ ansible_facts['user_dir'] }}/.zshrc"
    mode: '0644'

- name: Ensure default shell is set to zsh
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /bin/zsh
  become: true
