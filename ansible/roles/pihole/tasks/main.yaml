---
- name: Ensure upstream DNS is working before install
  ansible.builtin.copy:
    content: "nameserver 1.1.1.1\nnameserver 8.8.8.8\n"
    dest: /etc/resolv.conf
    mode: '0644'

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - dnsutils
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure /etc/pihole directory exists
  ansible.builtin.file:
    path: /etc/pihole
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Seed setupVars.conf for unattended automated installation
  ansible.builtin.copy:
    dest: /etc/pihole/setupVars.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      PIHOLE_INTERFACE=eth0
      IPV4_ADDRESS=192.168.1.21/24
      PIHOLE_DNS_1=1.1.1.1
      PIHOLE_DNS_2=8.8.8.8
      QUERY_LOGGING=true
      INSTALL_WEB_SERVER=true
      INSTALL_WEB_INTERFACE=true
      LIGHTTPD_ENABLED=false
      CACHE_SIZE=10000
      BLOCKING_ENABLED=true

- name: Download Pi-hole official automated installer
  ansible.builtin.get_url:
    url: https://install.pi-hole.net
    dest: /tmp/basic-install.sh
    mode: '0755'

- name: Execute Pi-hole unattended installation
  ansible.builtin.shell:
    cmd: bash /tmp/basic-install.sh --unattended </dev/null
  environment:
    DEBIAN_FRONTEND: noninteractive
    USER: root
  args:
    creates: /usr/local/bin/pihole

- name: Deploy declarative local DNS records into /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED HOMELAB DNS RECORDS"
    block: |
      {% for record in pihole_custom_records %}
      {{ record.ip }} {{ record.domain }}
      {% endfor %}
  notify: Reload pihole dns

- name: Disable NTP server and sync client in Pi-hole v6 (Unprivileged LXC guard)
  ansible.builtin.command:
    cmd: "pihole-FTL --config {{ item }} false"
  loop:
    - ntp.ipv4.active
    - ntp.ipv6.active
    - ntp.sync.active
  changed_when: false

- name: Ensure pihole-FTL service is running and enabled
  ansible.builtin.systemd:
    name: pihole-FTL
    state: started
    enabled: yes
