---
- name: Enable IPv4 and IPv6 forwarding
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: yes
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
  loop:
    - { key: 'net.ipv4.ip_forward', value: '1' }
    - { key: 'net.ipv6.conf.all.forwarding', value: '1' }

- name: Install Tailscale repository signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'

- name: Add Tailscale official APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main"
    state: present
    filename: tailscale

- name: Install Tailscale package
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure tailscaled is started and enabled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: yes
    state: started

- name: Check Tailscale login status
  ansible.builtin.command: tailscale status
  register: tailscale_status_check
  changed_when: false
  failed_when: false

- name: Authenticate and bring up Tailscale (if auth key provided)
  ansible.builtin.command:
    cmd: "tailscale up --authkey={{ tailscale_auth_key }} {{ tailscale_args }}"
  when:
    - tailscale_auth_key | length > 0
    - tailscale_status_check.rc != 0
  changed_when: true

- name: Bring up Tailscale interactively or reapply args (if already logged in or no auth key)
  ansible.builtin.command:
    cmd: "tailscale up {{ tailscale_args }}"
  when:
    - tailscale_auth_key | length == 0
  register: tailscale_up_result
  changed_when: "'Success' in tailscale_up_result.stdout or tailscale_up_result.rc == 0"
  failed_when: false

- name: Show Tailscale login URL if interactive authentication is required
  ansible.builtin.debug:
    msg: "{{ tailscale_up_result.stderr_lines | default(tailscale_up_result.stdout_lines | default([])) }}"
  when:
    - tailscale_auth_key | length == 0
    - tailscale_status_check.rc != 0
