---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - curl
      - tar
      - ca-certificates
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Create AdGuard Home installation directory
  ansible.builtin.file:
    path: "{{ adguard_install_dir }}"
    state: directory
    mode: '0755'

- name: Download and extract AdGuard Home binary
  ansible.builtin.unarchive:
    src: https://github.com/AdguardTeam/AdGuardHome/releases/latest/download/AdGuardHome_linux_amd64.tar.gz
    dest: /opt
    remote_src: yes
    creates: "{{ adguard_install_dir }}/AdGuardHome"

- name: Deploy AdGuard Home declarative configuration
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: "{{ adguard_install_dir }}/AdGuardHome.yaml"
    owner: root
    group: root
    mode: '0644'
    force: no
  notify: Restart AdGuardHome service

- name: Register and install AdGuard Home systemd service
  ansible.builtin.command:
    cmd: "{{ adguard_install_dir }}/AdGuardHome -s install"
    creates: /etc/systemd/system/AdGuardHome.service

- name: Ensure AdGuard Home service is enabled and started
  ansible.builtin.systemd:
    name: AdGuardHome
    enabled: yes
    state: started
