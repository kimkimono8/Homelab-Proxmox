---
- name: Configure TUN Device Passthrough on Proxmox Host
  hosts: proxmox_nodes
  tasks:
    - name: Inject TUN pass-through entry into /etc/pve/lxc/108.conf
      ansible.builtin.blockinfile:
        path: /etc/pve/lxc/108.conf
        marker: "# {mark} ANSIBLE MANAGED TAILSCALE TUN DEVICE"
        block: |
          lxc.cgroup2.devices.allow: c 10:200 rwm
          lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
      register: tun_entry

    - name: Reboot CT 108 to apply TUN configuration
      ansible.builtin.command: pct reboot 108
      when: tun_entry.changed

- name: Deploy Tailscale Subnet Router & Exit Node inside CT 108
  hosts: tailscale
  become: true
  roles:
    - tailscale_node
