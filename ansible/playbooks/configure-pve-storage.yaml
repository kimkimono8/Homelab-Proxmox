---
- name: Configure Complete 5-Disk Storage and Bind Mounts on PVE Host
  hosts: pve
  become: true
  vars:
    pve_storage_mounts:
      - name: "backup"
        uuid: "7f2ba6eb-dde7-4709-bcd8-144569641e9f"
        mount_path: "/mnt/backup"
        fstype: "ext4"
        opts: "noatime,nodiratime,nofail,x-systemd.device-timeout=15s"
      - name: "hdd2"
        uuid: "ed5d4d39-753c-4e27-98bc-382ac426a904"
        mount_path: "/mnt/hdd2"
        fstype: "ext4"
        opts: "noatime,nodiratime,nofail,x-systemd.device-timeout=15s"
      - name: "hdd3"
        uuid: "09be48bc-5801-4084-974f-3e74e2ebaf55"
        mount_path: "/mnt/hdd3"
        fstype: "ext4"
        opts: "noatime,nodiratime,nofail,x-systemd.device-timeout=15s"
      - name: "usb1"
        uuid: "67E220B3018C1C85"
        mount_path: "/mnt/usb1"
        fstype: "ntfs3"
        opts: "noatime,nodiratime,uid=0,gid=0,umask=000,iocharset=utf8,nofail,x-systemd.device-timeout=15s"
      - name: "usb2"
        uuid: "4E1AEA7B1AEA6007"
        mount_path: "/mnt/usb2"
        fstype: "ntfs3"
        opts: "force,noatime,nodiratime,uid=0,gid=0,umask=000,iocharset=utf8,nofail,x-systemd.device-timeout=15s"

    storage_containers:
      - id: 102
        name: "Arch-server"
      - id: 104
        name: "Jellyfin"
      - id: 105
        name: "Deluge"
      - id: 106
        name: "Arr-Stack"
      - id: 110
        name: "PhotoPrism"

    mount_targets:
      - "/mnt/backup"
      - "/mnt/hdd2"
      - "/mnt/hdd3"
      - "/mnt/usb1"
      - "/mnt/usb2"

  tasks:
    # 1. ดูแล Directory และ fstab บน PVE Host ทั้ง 5 ลูก
    - name: Ensure mount directories exist on PVE host
      ansible.builtin.file:
        path: "{{ item.mount_path }}"
        state: directory
        mode: '0777'
      loop: "{{ pve_storage_mounts }}"

    - name: Ensure all 5 disks are persistently mounted via /etc/fstab on Host
      ansible.posix.mount:
        path: "{{ item.mount_path }}"
        src: "UUID={{ item.uuid }}"
        fstype: "{{ item.fstype }}"
        opts: "{{ item.opts }}"
        state: mounted
      loop: "{{ pve_storage_mounts }}"

    # 2. สร้าง Directory ปลายทางภายในคอนเทนเนอร์รอรับ (Unprivileged LXC Guard)
    - name: Ensure destination mount directories exist inside containers
      ansible.builtin.command:
        cmd: "pct exec {{ item.id }} -- mkdir -p {{ mount_targets | join(' ') }}"
      loop: "{{ storage_containers }}"
      changed_when: false

    # 3. ล้างคอนฟิก mp เดิมที่เขียนค้างแบบ manual
    - name: Clean up legacy unmanaged mp lines from LXC configs
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ item.id }}.conf"
        regexp: '^mp[0-4]:'
        state: absent
      loop: "{{ storage_containers }}"

    # 4. ฉีด Bind Mounts ครบทั้ง 5 ลูก (mp0 - mp4) เข้าทุกคอนเทนเนอร์
    - name: Configure declarative 5-disk bind mounts into LXC configs
      ansible.builtin.blockinfile:
        path: "/etc/pve/lxc/{{ item.id }}.conf"
        marker: "# {mark} ANSIBLE MANAGED HOMELAB STORAGE"
        block: |
          mp0: /mnt/backup,mp=/mnt/backup
          mp1: /mnt/hdd2,mp=/mnt/hdd2
          mp2: /mnt/hdd3,mp=/mnt/hdd3
          mp3: /mnt/usb1,mp=/mnt/usb1
          mp4: /mnt/usb2,mp=/mnt/usb2
      loop: "{{ storage_containers }}"
      register: container_mounts

    # 5. รีบูตคอนเทนเนอร์มีเดีย (104, 105, 106)
    - name: Reboot remote media containers if storage config changed
      ansible.builtin.command:
        cmd: "pct reboot {{ item.item.id }}"
      loop: "{{ container_mounts.results }}"
      when: item.changed and item.item.id != 102

    # 6. หน่วงเวลารีบูต CT 102 (Arch-server) 10 วินาที เพื่อให้ Ansible ทำงานจนจบ
    - name: Schedule safe delayed reboot for Arch-server (CT 102) if changed
      ansible.builtin.command:
        cmd: "systemd-run --on-active=10s pct reboot 102"
      loop: "{{ container_mounts.results }}"
      when: item.changed and item.item.id == 102
