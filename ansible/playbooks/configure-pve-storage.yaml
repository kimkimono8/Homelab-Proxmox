---
- name: Configure Storage Mounts and Container Bind Definitions on PVE Host
  hosts: proxmox_nodes
  vars:
    ntfs_mounts:
      - label: "Seagate-Backup-plus"
        uuid: "4C08CBA008CB8802"
        mount_path: "/mnt/storage1"
      - label: "StoreJet"
        uuid: "0415544C044CC292"
        mount_path: "/mnt/storage2"

    synology_nfs_mounts:
      - share: "192.168.1.30:/volume1/nas"
        mount_path: "/mnt/synology/nas"
      - share: "192.168.1.30:/volumeUSB1/usbshare"
        mount_path: "/mnt/synology/usb1"
      - share: "192.168.1.30:/volumeUSB2/usbshare"
        mount_path: "/mnt/synology/usb2"

    storage_containers:
      - id: 102
        name: "Arch-server"
      - id: 104
        name: "Jellyfin"
      - id: 105
        name: "Deluge"
      - id: 106
        name: "Arr-Stack"

  tasks:
    # -------------------------------------------------------------
    # 1. PVE HOST STORAGE TARGETS
    # -------------------------------------------------------------
    - name: Ensure NTFS mount directories exist on PVE host
      ansible.builtin.file:
        path: "{{ item.mount_path }}"
        state: directory
        owner: root
        group: root
        mode: '0777'
      loop: "{{ ntfs_mounts }}"

    - name: Ensure NTFS drives are persistently mounted via /etc/fstab
      ansible.posix.mount:
        path: "{{ item.mount_path }}"
        src: "UUID={{ item.uuid }}"
        fstype: ntfs3
        opts: "noatime,nodiratime,uid=0,gid=0,umask=000,iocharset=utf8,nofail,x-systemd.device-timeout=15s"
        state: mounted
      loop: "{{ ntfs_mounts }}"

    - name: Ensure Synology mount directories exist on PVE host
      ansible.builtin.file:
        path: "{{ item.mount_path }}"
        state: directory
      loop: "{{ synology_nfs_mounts }}"

    - name: Ensure Synology NFS shares are persistently mounted via /etc/fstab
      ansible.posix.mount:
        path: "{{ item.mount_path }}"
        src: "{{ item.share }}"
        fstype: nfs
        opts: "_netdev,auto,nofail,nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2"
        state: mounted
      loop: "{{ synology_nfs_mounts }}"

    # -------------------------------------------------------------
    # 2. WRITE BIND MOUNTS
    # -------------------------------------------------------------
    - name: Configure bind mounts for all storage-enabled containers
      ansible.builtin.blockinfile:
        path: "/etc/pve/lxc/{{ item.id }}.conf"
        marker: "# {mark} ANSIBLE MANAGED STORAGE ({{ item.name }})"
        block: |
          mp0: /mnt/storage1,mp=/storage1
          mp1: /mnt/storage2,mp=/storage2
          mp2: /mnt/synology/nas,mp=/mnt/synology/nas
          mp3: /mnt/synology/usb1,mp=/mnt/synology/usb1
          mp4: /mnt/synology/usb2,mp=/mnt/synology/usb2
      loop: "{{ storage_containers }}"
      register: container_mounts

    # -------------------------------------------------------------
    # 3. REBOOT TARGETS ON CONFIG CHANGE
    # -------------------------------------------------------------
    - name: Reboot managed containers if storage config changed
      ansible.builtin.command: "pct reboot {{ item.item.id }}"
      loop: "{{ container_mounts.results }}"
      when: item.changed and item.item.id != 102

    - name: Schedule safe delayed reboot for Arch-server (CT 102) if changed
      ansible.builtin.command: systemd-run --on-active=10s pct reboot 102
      loop: "{{ container_mounts.results }}"
      when: item.changed and item.item.id == 102
