---
- name: Set root password and permit SSH password login across all LXCs
  hosts: all:!proxmox_nodes
  vars_prompt:
    - name: lxc_root_password
      prompt: "Enter desired root password for all LXCs"
      private: yes
      confirm: yes
  tasks:
    - name: Update root user password hash
      ansible.builtin.user:
        name: root
        password: "{{ lxc_root_password | password_hash('sha512') }}"

    - name: Ensure SSH daemon permits password authentication via drop-in config
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/01-permit-password.conf
        content: |
          PasswordAuthentication yes
          PermitRootLogin yes
        owner: root
        group: root
        mode: '0644'
      notify: Restart SSH service

  handlers:
    - name: Restart SSH service
      ansible.builtin.service:
        name: ssh
        state: restarted
